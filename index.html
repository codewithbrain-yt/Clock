<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Analog Clock</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="clock">
        <div class="hourHand"></div>
        <div class="minuteHand"></div>
        <div class="secondHand"></div>
        <div class="center"></div>
        <div class="time" id="time"></div>
        <ul>
            <li style="top: 2%; left: 48%; font-weight: bold;">12</li>
            <li style="top: 10%; left: 70%; color: red; font-size: 0.8em;">1</li>
            <li style="top: 25%; left: 85%; color: red; font-size: 0.8em;">2</li>
            <li style="top: 48%; left: 92%; font-weight: bold;">3</li>
            <li style="top: 70%; left: 85%; color: red; font-size: 0.8em;">4</li>
            <li style="top: 85%; left: 70%; color: red; font-size: 0.8em;">5</li>
            <li style="top: 92%; left: 48%; font-weight: bold;">6</li>
            <li style="top: 85%; left: 25%; color: red; font-size: 0.8em;">7</li>
            <li style="top: 70%; left: 10%; color: red; font-size: 0.8em;">8</li>
            <li style="top: 48%; left: 2%; font-weight: bold;">9</li>
            <li style="top: 25%; left: 10%; color: red; font-size: 0.8em;">10</li>
            <li style="top: 10%; left: 25%; color: red; font-size: 0.8em;">11</li>
          </ul>
          
    </div>
    <script src="script.js"></script>
</body>

</html>
